<div class="lang-switch" aria-label="Language switch">
  <button class="lang-toggle is-active" type="button" data-lang="it">🇮🇹 IT</button>
  <button class="lang-toggle" type="button" data-lang="en">🇬🇧 EN</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const root = document.documentElement;
  const buttons = Array.from(document.querySelectorAll(".lang-toggle"));
  if (!buttons.length) return;

  const stored = localStorage.getItem("sea4blue-lang");

  function setLang(lang) {
    root.classList.remove("lang-it", "lang-en");
    root.classList.add(`lang-${lang}`);
    localStorage.setItem("sea4blue-lang", lang);
    buttons.forEach((button) => {
      button.classList.toggle("is-active", button.dataset.lang === lang);
    });
  }

  setLang(stored === "en" ? "en" : "it");

  buttons.forEach((button) => {
    button.addEventListener("click", () => setLang(button.dataset.lang));
  });
});
</script>
